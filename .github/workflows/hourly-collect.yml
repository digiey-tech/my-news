# Hourly news collection for the deployed My News API.
# Runs on GitHub's servers whether or not anyone has the app open.
# Repository secrets required (Settings > Secrets and variables > Actions):
#   MYNEWS_API_URL      e.g. https://mynews-api.onrender.com  (no trailing slash)
#   MYNEWS_ADMIN_TOKEN  the ADMIN_TOKEN value configured on the server
#
# NOTE: GitHub only runs workflows from the repository root's .github folder.
# If this project lives in a subfolder of your repository, move this file to
# <repo root>/.github/workflows/.
name: Hourly news collection

on:
  schedule:
    - cron: "5 * * * *"   # minute 5 of every hour, UTC
  workflow_dispatch: {}    # manual "Run workflow" button for demonstrations

concurrency:
  group: mynews-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake the API (free instances sleep when idle)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "${{ secrets.MYNEWS_API_URL }}/health"; then exit 0; fi
            echo "API not ready yet (attempt $i), waiting..."
            sleep 20
          done
          echo "API did not respond to /health"; exit 1

      - name: Run collection
        run: |
          curl -fsS --max-time 900 -X POST \
            -H "Authorization: Bearer ${{ secrets.MYNEWS_ADMIN_TOKEN }}" \
            "${{ secrets.MYNEWS_API_URL }}/api/admin/collect?trigger=schedule" | tee result.json
          echo
          node -e "const r=require('./result.json'); console.log('status:', r.status ?? 'skipped', '| new articles:', r.articles_new, '| expired:', r.articles_expired, '| summaries:', r.summaries_generated); if (r.status === 'failed') process.exit(1)"
