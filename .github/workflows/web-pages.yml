# Builds the Flutter app for the web and publishes it on GitHub Pages
# (https://digiey-tech.github.io/my-news/). Used to demonstrate the client on an
# iPhone in Safari; the Android APK is built separately (see README).
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - name: Build web app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /my-news/ \
            --dart-define=API_BASE_URL=https://mynews-api.onrender.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
